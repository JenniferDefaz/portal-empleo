{% extends "./plantillaPrin.html" %}
{% block contenido %}
<div class="container">
<div class="row">
<div class="col-md-3"></div>
<div class="col-md-6">
<br>
<h1><b>Actualizar Candidato</b></h1>
<hr>
<form enctype="multipart/form-data" id="form_editar_candidato" action="/actualizarCandidato/{{ candidato.id }}/" method="post">
    {% csrf_token %}

    <b>Nombre Completo:</b> <br>
    <input required minlength="3" maxlength="150" placeholder="Ingrese el nombre completo" class="form-control" type="text" name="nombre_completo" value="{{ candidato.nombre_completo }}">
    <br>

    <b>Fecha de Nacimiento:</b> <br>
    <input required class="form-control" type="date" name="fecha_nacimiento" 
           id="fecha_nacimiento"
           max="{{ hoy }}"
           value="{{ candidato.fecha_nacimiento|date:'Y-m-d' }}">
    <br>

    <b>Género:</b> <br>
    <div class="mt-1">
        <label>
            <input type="radio" name="genero" value="M" {% if candidato.genero == 'M' %}checked{% endif %}> Masculino
        </label>
        &nbsp;&nbsp;
        <label>
            <input type="radio" name="genero" value="F" {% if candidato.genero == 'F' %}checked{% endif %}> Femenino
        </label>
        &nbsp;&nbsp;
        <label>
            <input type="radio" name="genero" value="O" {% if candidato.genero == 'O' %}checked{% endif %}> Otro
        </label>
    </div>
    <br>

    <b>Nivel de Estudios:</b> <br>
    <select required class="form-control" name="nivel_estudios">
        <option value="">-- Seleccione --</option>
        <option value="GRADO" {% if candidato.nivel_estudios == 'GRADO' %}selected{% endif %}>Grado</option>
        <option value="MASTER" {% if candidato.nivel_estudios == 'MASTER' %}selected{% endif %}>Máster</option>
        <option value="DOCTORADO" {% if candidato.nivel_estudios == 'DOCTORADO' %}selected{% endif %}>Doctorado</option>
    </select>
    <br>

    <b>Disponibilidad para viajar o mudarse:</b> <br>
    <label>
        <input type="checkbox" name="disponible_viajar" {% if candidato.disponible_viajar %}checked{% endif %}> Sí, estoy disponible
    </label>
    <br><br>

    <b>Foto de Perfil:</b><br>
    <input type="file" name="foto" id="foto" class="form-control"
        {% if candidato.foto %}
        data-initial-preview="<img src='{{ candidato.foto.url }}' class='file-preview-image'>"
        data-initial-preview-config='[{"caption": "{{ candidato.foto.name|cut:"empleo/" }}", "showDelete": false}]'
        {% endif %}
    >
    <br>
    <br>

    <button class="btn btn-success" type="submit"><i class="fas fa-save me-1"></i> Actualizar</button>
    <a href="/listadoCandidatos/" class="btn btn-secondary"><i class="fas fa-times me-1"></i> Cancelar</a>
</form>
<br>
</div>
</div>
</div>

<script>
$(document).ready(function() {
    // Método: solo letras y espacios (patrón de referencia)
    jQuery.validator.addMethod("letras", function(value, element) {
        return this.optional(element) || /^[A-Za-zÁÉÍÑÓÚáéíñóú\s]*$/.test(value);
    }, "Este campo solo acepta letras");

    // Método: fecha debe ser estrictamente anterior a hoy
    jQuery.validator.addMethod("fechaPasada", function(value, element) {
        if (!value) return true;
        var hoy = new Date();
        hoy.setHours(0, 0, 0, 0);
        var fechaIngresada = new Date(value + 'T00:00:00');
        return fechaIngresada < hoy;
    }, "La fecha de nacimiento no puede ser hoy ni una fecha futura");

    // Método: tamaño máximo de archivo (patrón de referencia)
    jQuery.validator.addMethod('filesize', function(value, element, param) {
        return this.optional(element) || (element.files[0].size <= param);
    });

    $("#form_editar_candidato").validate({
        errorElement: "span",
        errorClass: "text-danger small",
        highlight: function(element) {
            $(element).addClass("is-invalid").removeClass("is-valid");
        },
        unhighlight: function(element) {
            $(element).removeClass("is-invalid");
        },
        errorPlacement: function(error, element) {
            if (element.attr("type") === "radio" || element.attr("type") === "checkbox") {
                error.insertAfter(element.closest("div, label").last());
            } else {
                error.insertAfter(element);
            }
        },
        rules: {
            nombre_completo: {
                required: true,
                minlength: 3,
                maxlength: 150,
                letras: true
            },
            fecha_nacimiento: {
                required: true,
                fechaPasada: true
            },
            genero: {
                required: true
            },
            nivel_estudios: {
                required: true
            },
            foto: {
                filesize: 2097152  // 2MB máximo
            }
        },
        messages: {
            nombre_completo: {
                required: "Por favor, ingrese el nombre completo",
                minlength: "El nombre debe tener al menos 3 caracteres",
                maxlength: "El nombre no puede exceder 150 caracteres",
                letras: "El nombre solo puede contener letras y espacios"
            },
            fecha_nacimiento: {
                required: "Por favor, ingrese la fecha de nacimiento",
                fechaPasada: "La fecha de nacimiento no puede ser hoy ni una fecha futura"
            },
            genero: {
                required: "Por favor, seleccione un género"
            },
            nivel_estudios: {
                required: "Por favor, seleccione el nivel de estudios"
            },
            foto: {
                filesize: "La foto no puede superar 2MB"
            }
        }
    });

    $("#foto").fileinput({
        language: "es",
        allowedFileExtensions: ["jpg", "jpeg", "png"],
        showCaption: false,
        dropZoneEnabled: true,
        showClose: false,
    });
    $(".fileinput-upload").hide();
});
</script>

{% endblock %}
