{% extends "./plantillaPrin.html" %}
{% block contenido %}
<div class="container">
<div class="row">
<div class="col-md-3"></div>
<div class="col-md-6">
<br>
<h1><b>Actualizar Postulación</b></h1>
<hr>
<form enctype="multipart/form-data" id="form_editar_postulacion" action="/actualizarPostulacion/{{ postulacion.id }}/" method="post">
    {% csrf_token %}

    <b>Vacante a la que aplica:</b> <br>
    <select required class="form-control" name="vacante">
        <option value="">-- Seleccione --</option>
        <option value="DESARROLLADOR" {% if postulacion.vacante == 'DESARROLLADOR' %}selected{% endif %}>Desarrollador</option>
        <option value="DISENADOR" {% if postulacion.vacante == 'DISENADOR' %}selected{% endif %}>Diseñador</option>
    </select>
    <br>

    <b>Pretensión Salarial ($):</b> <br>
    <input required min="1" placeholder="Ingrese su pretensión salarial" class="form-control" type="number" name="pretension_salarial" value="{{ postulacion.pretension_salarial }}">
    <br>

    {% if user.is_staff %}
    <b>Estado de la Postulación:</b> <br>
    <select required class="form-control" name="estado">
        <option value="PENDIENTE" {% if postulacion.estado == 'PENDIENTE' %}selected{% endif %}>Pendiente</option>
        <option value="PRESELECCIONADO" {% if postulacion.estado == 'PRESELECCIONADO' %}selected{% endif %}>Preseleccionado</option>
        <option value="RECHAZADO" {% if postulacion.estado == 'RECHAZADO' %}selected{% endif %}>Rechazado</option>
    </select>
    <br>
    {% endif %}

    <b>Currículum Vitae (PDF):</b><br>
    <input type="file" name="cv_pdf" id="cv_pdf" class="form-control"
        {% if postulacion.cv_pdf %}
        data-initial-preview="<div class='file-preview-other'><i class='icon-file-pdf' style='font-size:50px;color:red;'></i></div>"
        data-initial-preview-config='[{"caption": "{{ postulacion.cv_pdf.name|cut:"cvs_postulaciones/" }}", "showDelete": false}]'
        {% endif %}
    >
    <br>
    <br>

    <button class="btn btn-success" type="submit"><i class="icon-save"></i> Actualizar</button>
    <a href="/listadoPostulaciones/" class="btn btn-secondary"><i class="icon-cancel"></i> Cancelar</a>
</form>
<br>
</div>
</div>
</div>

<script>
$("#form_editar_postulacion").validate({
    rules: {
        vacante: {
            required: true
        },
        pretension_salarial: {
            required: true,
            min: 1,
            number: true
        }
    },
    messages: {
        vacante: {
            required: "Por favor, seleccione la vacante"
        },
        pretension_salarial: {
            required: "Por favor, ingrese su pretensión salarial",
            min: "El salario debe ser mayor a 0",
            number: "Por favor, ingrese solo números"
        }
    }
});
</script>

<script>
$(document).ready(function() {
    $("#cv_pdf").fileinput({
        language: "es",
        allowedFileExtensions: ["pdf"],
        showCaption: false,
        dropZoneEnabled: true,
        showClose: false,
    });
    $(".fileinput-upload").hide();
});
</script>

{% endblock %}
