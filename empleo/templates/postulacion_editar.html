{% extends "./plantillaPrin.html" %}
{% block contenido %}
<div class="container">
<div class="row">
<div class="col-md-3"></div>
<div class="col-md-6">
<br>
<h1><b>Actualizar Postulación</b></h1>
<hr>
<form enctype="multipart/form-data" id="form_editar_postulacion" action="/actualizarPostulacion/{{ postulacion.id }}/" method="post">
    {% csrf_token %}

    <b>Vacante a la que aplica:</b> <br>
    <select required class="form-control" name="vacante">
        <option value="">-- Seleccione --</option>
        <option value="DESARROLLADOR" {% if postulacion.vacante == 'DESARROLLADOR' %}selected{% endif %}>Desarrollador</option>
        <option value="DISENADOR" {% if postulacion.vacante == 'DISENADOR' %}selected{% endif %}>Diseñador</option>
    </select>
    <br>

    <b>Pretensión Salarial ($):</b> <br>
    <input required min="1" placeholder="Ingrese su pretensión salarial" class="form-control" type="number" name="pretension_salarial" value="{{ postulacion.pretension_salarial }}">
    <br>

    {% if user.is_staff %}
    <b>Estado de la Postulación:</b> <br>
    <select required class="form-control" name="estado">
        <option value="PENDIENTE" {% if postulacion.estado == 'PENDIENTE' %}selected{% endif %}>Pendiente</option>
        <option value="PRESELECCIONADO" {% if postulacion.estado == 'PRESELECCIONADO' %}selected{% endif %}>Preseleccionado</option>
        <option value="RECHAZADO" {% if postulacion.estado == 'RECHAZADO' %}selected{% endif %}>Rechazado</option>
    </select>
    <br>
    {% endif %}

    <b>Currículum Vitae (PDF):</b><br>
    <input type="file" name="cv_pdf" id="cv_pdf" class="form-control"
        {% if postulacion.cv_pdf %}
        data-initial-preview="<iframe src='{{ postulacion.cv_pdf.url }}' width='100%' height='250px' style='border:none;'></iframe>"
        data-initial-preview-config='[{"caption": "{{ postulacion.cv_pdf.name|cut:"cvs_postulaciones/" }}", "showDelete": false, "width": "400px"}]'
        {% endif %}
    >
    <span id="error_cv_pdf" class="text-danger small d-block"></span>
    <br>
    <br>

    <button class="btn btn-success" type="submit"><i class="fas fa-save me-1"></i> Actualizar</button>
    <a href="/listadoPostulaciones/" class="btn btn-secondary"><i class="fas fa-times me-1"></i> Cancelar</a>
</form>
<br>
</div>
</div>
</div>

<script>
$(document).ready(function() {
    // Método: solo números (patrón de referencia)
    jQuery.validator.addMethod("numbersonly", function(value, element) {
        return this.optional(element) || /[0-9]/.test(value);
    }, "Este campo solo acepta números");

    // Método: valor positivo (patrón de referencia)
    jQuery.validator.addMethod('positivo', function(value, element, param) {
        return value >= 0;
    }, "El valor ingresado no puede ser negativo");

    // Método: tamaño máximo de archivo (patrón de referencia)
    jQuery.validator.addMethod('filesize', function(value, element, param) {
        return this.optional(element) || (element.files[0].size <= param);
    });

    $("#form_editar_postulacion").validate({
        errorElement: "span",
        errorClass: "text-danger small",
        highlight: function(element) {
            $(element).addClass("is-invalid").removeClass("is-valid");
        },
        unhighlight: function(element) {
            $(element).removeClass("is-invalid");
        },
        errorPlacement: function(error, element) {
            if (element.attr("name") === "cv_pdf") {
                $("#error_cv_pdf").html(error);
            } else {
                error.insertAfter(element);
            }
        },
        rules: {
            vacante: {
                required: true
            },
            pretension_salarial: {
                required: true,
                numbersonly: true,
                positivo: true,
                min: 1,
                max: 999999
            },
            cv_pdf: {
                filesize: 5242880  // 5MB máximo
            }
        },
        messages: {
            vacante: {
                required: "Por favor, seleccione la vacante"
            },
            pretension_salarial: {
                required: "Por favor, ingrese su pretensión salarial",
                numbersonly: "Este campo solo acepta números",
                positivo: "El valor no puede ser negativo",
                min: "El salario debe ser mayor a 0",
                max: "El salario no puede exceder $999,999"
            },
            cv_pdf: {
                filesize: "El CV no puede superar 5MB"
            }
        }
    });

    $("#cv_pdf").fileinput({
        language: "es",
        allowedFileExtensions: ["pdf"],
        showCaption: false,
        dropZoneEnabled: true,
        showClose: false,
    });
    $(".fileinput-upload").hide();

    // Cuando fileinput detecta error (extensión o tamaño), disparar revalidación
    $("#cv_pdf").on("fileinvalid fileerror", function() {
        $("#form_editar_postulacion").validate().element("#cv_pdf");
    });
    // Cuando se selecciona un archivo válido, limpiar el error
    $("#cv_pdf").on("fileloaded", function() {
        $("#error_cv_pdf").empty();
    });
});
</script>

{% endblock %}
