{% extends "./plantillaPrin.html" %}
{% block contenido %}
    <div class="container">
        <div class="row">
            <div class="col-md-3"></div>
                <div class="col-md-6">
                    <br>
                    <h1><b>Nueva Postulación</b></h1>
                    <hr>
                    <form enctype="multipart/form-data" id="form_nueva_postulacion" action="/guardarPostulacion/" method="post">
                        {% csrf_token %}
                        <b>Vacante a la que aplica:</b> <br>
                        <select class="form-control" name="vacante">
                            <option value="">Seleccione...</option>
                            <option value="DESARROLLADOR">Desarrollador</option>
                            <option value="DISENADOR">Diseñador</option>
                        </select>
                        <br>
                        <b>Pretensión salarial:</b> <br>
                        <input placeholder="Ingrese su pretensión salarial" class="form-control" type="number" name="pretension_salarial" min="1" step="1">
                        <br>
                        <b>Currículum Vitae (PDF):</b>
                        <input type="file" name="cv_pdf" id="cv_pdf" required>
                        <span id="error_cv_pdf" class="text-danger small d-block"></span>
                        <br>
                        <br>
                        <button class="btn btn-success" type="submit">
                            <i class="fas fa-paper-plane me-1"></i> Enviar
                        </button>
                        <a href="/listadoPostulaciones/" class="btn btn-secondary">
                            <i class="fas fa-times me-1"></i> Cancelar
                        </a>
                    </form>
                    <br>
                </div>
            </div>
        </div>
    <script>
        $(document).ready(function() {
            // Método: solo números (patrón de referencia)
            jQuery.validator.addMethod("numbersonly", function(value, element) {
                return this.optional(element) || /[0-9]/.test(value);
            }, "Este campo solo acepta números");

            // Método: valor positivo (patrón de referencia)
            jQuery.validator.addMethod('positivo', function(value, element, param) {
                return value >= 0;
            }, "El valor ingresado no puede ser negativo");

            // Método: tamaño máximo de archivo (patrón de referencia)
            jQuery.validator.addMethod('filesize', function(value, element, param) {
                return this.optional(element) || (element.files[0].size <= param);
            });

            $("#form_nueva_postulacion").validate({
                errorElement: "span",
                errorClass: "text-danger small",
                highlight: function(element) {
                    $(element).addClass("is-invalid").removeClass("is-valid");
                },
                unhighlight: function(element) {
                    $(element).removeClass("is-invalid");
                },
                errorPlacement: function(error, element) {
                    // El CV usa fileinput: el error va al span dedicado debajo del widget
                    if (element.attr("name") === "cv_pdf") {
                        $("#error_cv_pdf").html(error);
                    } else {
                        error.insertAfter(element);
                    }
                },
                rules: {
                    vacante: {
                        required: true
                    },
                    pretension_salarial: {
                        required: true,
                        numbersonly: true,
                        positivo: true,
                        min: 1,
                        max: 999999
                    },
                    cv_pdf: {
                        required: true,
                        filesize: 5242880  // 5MB máximo
                    }
                },
                messages: {
                    vacante: {
                        required: "Por favor, seleccione la vacante a la que aplica"
                    },
                    pretension_salarial: {
                        required: "Por favor, ingrese su pretensión salarial",
                        numbersonly: "Este campo solo acepta números",
                        positivo: "El valor no puede ser negativo",
                        min: "La pretensión salarial debe ser mayor a 0",
                        max: "La pretensión salarial no puede exceder $999,999"
                    },
                    cv_pdf: {
                        required: "Debe adjuntar su Currículum Vitae en PDF",
                        filesize: "El CV no puede superar 5MB"
                    }
                }
            });

            $("#cv_pdf").fileinput({
                language: "es",
                allowedFileExtensions: ["pdf"],
                showCaption: false,
                dropZoneEnabled: true,
                showClose: false,
            });
            $(".fileinput-upload").hide();

            // Cuando fileinput detecta error (extensión o tamaño), disparar revalidación
            $("#cv_pdf").on("fileinvalid fileerror", function() {
                $("#form_nueva_postulacion").validate().element("#cv_pdf");
            });
            // Cuando se selecciona un archivo válido, limpiar el error
            $("#cv_pdf").on("fileloaded", function() {
                $("#error_cv_pdf").empty();
            });
        });
    </script>
{% endblock %}
