{% extends "./plantillaPrin.html" %}
{% block contenido %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4><b><i class="fas fa-file-pdf text-danger me-2"></i>CV de {{ postulacion.candidato.nombre_completo }}</b></h4>
                <div>
                    <a href="{{ postulacion.cv_pdf.url }}" download class="btn btn-dark me-2">
                        <i class="fas fa-download me-1"></i> Descargar PDF
                    </a>
                    <a href="/listadoPostulaciones/" class="btn btn-secondary">
                        <i class="fas fa-arrow-left me-1"></i> Volver
                    </a>
                </div>
            </div>
            <div class="card shadow border-0">
                <div class="card-body p-0">
                    <iframe src="{{ postulacion.cv_pdf.url }}"
                        width="100%"
                        height="750px"
                        style="border:none; border-radius: 8px;">
                        Tu navegador no soporta la vista previa de PDFs.
                        <a href="{{ postulacion.cv_pdf.url }}">Haz clic aquí para descargarlo.</a>
                    </iframe>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
